# ---------------------------------------------------------------
# MobMastery configuration (v1.1.0)
# ---------------------------------------------------------------
# Default server language: en or tr
# Every player can pick their own with /rpg lang <en|tr>
# NOTE: mob name tags are shared by all players, so they use this server language.
language: en

# ---------------- MOB LEVEL SYSTEM ----------------
mob-levels:
  enabled: true
  max-level: 60
  # Chance that a hostile mob gets a level (0.5 = half leveled, half normal)
  leveled-chance: 0.5
  # Level range per dimension. The farther from the center (world spawn / 0,0),
  # the higher inside the range. full-level-distance = blocks needed to reach max-level.
  dimensions:
    overworld:
      min-level: 1
      max-level: 35
      full-level-distance: 3500
    nether:
      min-level: 10
      max-level: 60
      full-level-distance: 600
    end:
      min-level: 1
      max-level: 10
      full-level-distance: 500
  # Each level adds this much extra "health" (damage taken is divided) and damage dealt
  health-per-level: 0.10
  damage-per-level: 0.025
  # Each level adds this much extra vanilla XP orb drop
  xp-per-level: 0.03
  # false = the name tag only shows when you look straight at the mob (no X-ray through walls)
  show-name-always: false
  # server = use the "language" option above, or write en / tr
  name-language: server
  name-format: "&8[{color}Lv.{level}&8] &c{name}"
  # Extra drops only when a player kills the mob
  only-player-kill: true
  disabled-worlds: []
  excluded-types:
    - WARDEN

  # Random armor for leveled mobs (only some mobs, only sometimes).
  # The rarest set is rolled first; the first successful roll wins.
  armor:
    enabled: true
    # chance (0.0 - 1.0) that a worn piece drops when the mob dies
    drop-chance: 0.05
    mobs:
      - ZOMBIE
      - ZOMBIE_VILLAGER
      - HUSK
      - DROWNED
      - SKELETON
      - STRAY
      - BOGGED
      - WITHER_SKELETON
      - PIGLIN
      - PIGLIN_BRUTE
      - ZOMBIFIED_PIGLIN
    sets:
      netherite:
        min-level: 52
        max-level: 60
        chance: 0.004
        piece-chance: 1.0
      diamond:
        min-level: 35
        max-level: 60
        chance: 0.015
        piece-chance: 0.8
      iron:
        min-level: 15
        max-level: 45
        chance: 0.035
        piece-chance: 0.8
      chainmail:
        min-level: 20
        max-level: 45
        chance: 0.025
        piece-chance: 0.8
      golden:
        min-level: 8
        max-level: 35
        chance: 0.04
        piece-chance: 0.8
      leather:
        min-level: 1
        max-level: 25
        chance: 0.06
        piece-chance: 0.8

  # Very rare strange items. 'chance' is checked once per kill; if it succeeds, ONE item is
  # picked from the list. The last number of each item is its weight (higher = more likely).
  oddities:
    enabled: true
    chance: 0.012
    # normal (non-leveled) hostile mobs use chance x this value
    normal-mob-multiplier: 0.5
    items:
      - "GOAT_HORN:1:1:0.004"
      - "ECHO_SHARD:1:1:0.003"
      - "DISC_FRAGMENT_5:1:2:0.004"
      - "HEART_OF_THE_SEA:1:1:0.002"
      - "NAUTILUS_SHELL:1:1:0.004"
      - "SADDLE:1:1:0.004"
      - "NAME_TAG:1:1:0.006"
      - "SPONGE:1:2:0.004"
      - "DIAMOND_HORSE_ARMOR:1:1:0.002"
      - "TOTEM_OF_UNDYING:1:1:0.002"
      - "ENCHANTED_GOLDEN_APPLE:1:1:0.001"
      - "ELYTRA:1:1:0.0003"

  # Drop format -> "MATERIAL:min:max:chance"  (chance 0.0 - 1.0)
  tiers:
    tier-1:
      min-level: 1
      max-level: 15
      color: "&a"
      xp-multiplier: 1.0
      items:
        - "IRON_NUGGET:1:3:0.40"
        - "COAL:1:3:0.30"
        - "BREAD:1:2:0.25"
        - "ARROW:2:5:0.30"
      rare-items:
        - "GOLD_INGOT:1:1:0.03"
        - "EMERALD:1:1:0.01"
    tier-2:
      min-level: 16
      max-level: 30
      color: "&e"
      xp-multiplier: 1.3
      items:
        - "IRON_INGOT:1:3:0.40"
        - "GOLD_NUGGET:2:5:0.35"
        - "COOKED_BEEF:1:3:0.30"
        - "EXPERIENCE_BOTTLE:1:2:0.15"
      rare-items:
        - "DIAMOND:1:1:0.02"
        - "GOLDEN_APPLE:1:1:0.02"
    tier-3:
      min-level: 31
      max-level: 45
      color: "&6"
      xp-multiplier: 1.7
      items:
        - "GOLD_INGOT:1:3:0.40"
        - "LAPIS_LAZULI:2:6:0.35"
        - "EMERALD:1:2:0.20"
        - "ENDER_PEARL:1:1:0.15"
        - "EXPERIENCE_BOTTLE:1:3:0.25"
      rare-items:
        - "DIAMOND:1:2:0.05"
        - "GOLDEN_APPLE:1:1:0.04"
        - "NAME_TAG:1:1:0.02"
    tier-4:
      min-level: 46
      max-level: 60
      color: "&c"
      xp-multiplier: 2.2
      items:
        - "DIAMOND:1:2:0.35"
        - "EMERALD:1:3:0.35"
        - "ENDER_PEARL:1:2:0.25"
        - "EXPERIENCE_BOTTLE:2:5:0.40"
      rare-items:
        - "NETHERITE_SCRAP:1:1:0.04"
        - "TOTEM_OF_UNDYING:1:1:0.01"
        - "ENCHANTED_GOLDEN_APPLE:1:1:0.005"
        - "NETHERITE_INGOT:1:1:0.003"

# ---------------- HUD (on-screen display) ----------------
hud:
  enabled: true
  # bottom-center line above the hotbar while holding a sword/axe/pickaxe/shovel:
  # health, mana, skill level and right-click ability status
  actionbar: true
  # top-center XP bar that appears when you gain XP and disappears after a few seconds
  xp-bar: true
  xp-bar-seconds: 4

# ---------------- TOOL SKILLS ----------------
skills:
  max-level: 80
  # XP needed for next level = xp-base + level^1.6 * xp-growth
  xp-base: 100
  xp-growth: 12
  xp-multiplier: 1.0
  # Sword/axe damage bonus per skill level (0.004 -> +32% at level 80)
  damage-per-level: 0.004
  xp:
    kill-normal: 4
    kill-leveled-base: 6
    kill-per-level: 1.5
    kill-passive: 1
    ore: 6
    ore-rare: 15
    stone: 1
    log: 3
    dirt: 1
  # Mana is used by the right-click abilities
  mana:
    base: 50
    per-level: 0.5
    regen-per-second: 3
  # Right-click abilities (unlock at skill level 5).
  # Right-click in the air, or sneak + right-click on a block, while holding the tool.
  active:
    slash:
      mana: 25
      cooldown: 6
      damage: 6
    slam:
      mana: 30
      cooldown: 8
      damage: 5
    frenzy:
      mana: 35
      cooldown: 25
      seconds: 12
    leap:
      mana: 20
      cooldown: 6
  abilities:
    lifesteal-chance: 0.15
    lifesteal-amount: 2.0
    executioner-bonus: 0.30
    cleave-chance: 0.25
    cleave-damage: 0.5
    lumberjack-chance: 0.20
    haste-seconds: 3
    doubledrop-chance: 0.20
    jackpot-chance: 0.05
    shovel-doubledrop-chance: 0.15
    treasure-chance: 0.03
  # Shovel "treasure" ability picks one of these at random (chance value is ignored here)
  treasure-items:
    - "CLAY_BALL:2:6:1.0"
    - "GOLD_NUGGET:3:8:1.0"
    - "FLINT:2:5:1.0"
    - "EMERALD:1:1:1.0"
    - "DIAMOND:1:1:1.0"

# ---------------- ANTI-LAG ----------------
anti-lag:
  enabled: true
  disabled-worlds: []
  # Admin alerts always go to the console (max once per 5 minutes per alert type).
  # Set true to also send them to admins in chat.
  admin-chat-alerts: false
  # Removes the oldest excess mobs per chunk (never tamed, leashed, name-tagged or ridden mobs)
  entity-limits:
    enabled: true
    check-interval-seconds: 30
    max-monsters-per-chunk: 16
    max-animals-per-chunk: 20
    max-other-per-chunk: 10
  # Stops natural spawns in chunks that are already crowded
  spawn-limiter:
    enabled: true
    chunk-entity-hard-cap: 70
  # Clears dropped items on the ground on a timer
  item-clear:
    enabled: true
    interval-minutes: 5
    # actionbar (default, no chat spam), chat, or none
    notify: actionbar
    # countdown (in seconds) shown before clearing. Only shown when enough items are on the ground.
    warn-seconds: [5, 4, 3, 2, 1]
    # "cleared X items" is only announced when at least this many items were removed
    announce-min-items: 20
    min-item-age-seconds: 20
    keep-materials:
      - ELYTRA
      - TOTEM_OF_UNDYING
      - NETHERITE_INGOT
      - SHULKER_BOX
  # Estimates TPS. When it drops below lag-tps the plugin enters "lag mode":
  # natural spawns are paused and an emergency cleanup runs.
  tps-watch:
    lag-tps: 16.0
    recover-tps: 18.5
  memory-watch:
    enabled: true
    # 0.92 = 92% of max heap
    threshold: 0.92
