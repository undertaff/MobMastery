# ---------------------------------------------------------------
# MobMastery configuration
# ---------------------------------------------------------------
# Default language for the server: en or tr
# Every player can pick their own with /rpg lang <en|tr>
language: en

# ---------------- MOB LEVEL SYSTEM ----------------
mob-levels:
  enabled: true
  max-level: 60
  # Chance that a hostile mob gets a level (0.5 = half of them are leveled, half are normal)
  leveled-chance: 0.5
  # Mobs get stronger the farther they spawn from the world spawn
  blocks-per-level: 100
  nether-bonus: 15
  end-bonus: 30
  # Each level adds this much extra "health" (damage taken is divided) and damage dealt
  health-per-level: 0.10
  damage-per-level: 0.025
  # Each level adds this much extra vanilla XP orb drop
  xp-per-level: 0.03
  show-name: true
  name-format: "&8[{color}Lv.{level}&8] &c{name}"
  # Extra drops only when a player kills the mob
  only-player-kill: true
  disabled-worlds: []
  excluded-types: []
  # Drop format -> "MATERIAL:min:max:chance"  (chance 0.0 - 1.0)
  tiers:
    tier-1:
      min-level: 1
      max-level: 15
      color: "&a"
      xp-multiplier: 1.0
      items:
        - "IRON_NUGGET:1:3:0.40"
        - "COAL:1:3:0.30"
        - "BREAD:1:2:0.25"
        - "ARROW:2:5:0.30"
      rare-items:
        - "GOLD_INGOT:1:1:0.03"
        - "EMERALD:1:1:0.01"
    tier-2:
      min-level: 16
      max-level: 30
      color: "&e"
      xp-multiplier: 1.3
      items:
        - "IRON_INGOT:1:3:0.40"
        - "GOLD_NUGGET:2:5:0.35"
        - "COOKED_BEEF:1:3:0.30"
        - "EXPERIENCE_BOTTLE:1:2:0.15"
      rare-items:
        - "DIAMOND:1:1:0.02"
        - "GOLDEN_APPLE:1:1:0.02"
    tier-3:
      min-level: 31
      max-level: 45
      color: "&6"
      xp-multiplier: 1.7
      items:
        - "GOLD_INGOT:1:3:0.40"
        - "LAPIS_LAZULI:2:6:0.35"
        - "EMERALD:1:2:0.20"
        - "ENDER_PEARL:1:1:0.15"
        - "EXPERIENCE_BOTTLE:1:3:0.25"
      rare-items:
        - "DIAMOND:1:2:0.05"
        - "GOLDEN_APPLE:1:1:0.04"
        - "NAME_TAG:1:1:0.02"
    tier-4:
      min-level: 46
      max-level: 60
      color: "&c"
      xp-multiplier: 2.2
      items:
        - "DIAMOND:1:2:0.35"
        - "EMERALD:1:3:0.35"
        - "ENDER_PEARL:1:2:0.25"
        - "EXPERIENCE_BOTTLE:2:5:0.40"
      rare-items:
        - "NETHERITE_SCRAP:1:1:0.04"
        - "TOTEM_OF_UNDYING:1:1:0.01"
        - "ENCHANTED_GOLDEN_APPLE:1:1:0.005"
        - "NETHERITE_INGOT:1:1:0.003"

# ---------------- TOOL SKILLS ----------------
skills:
  max-level: 80
  # XP needed for next level = xp-base + level^1.6 * xp-growth
  xp-base: 100
  xp-growth: 12
  xp-multiplier: 1.0
  # Sword/axe damage bonus per skill level (0.004 -> +32% at level 80)
  damage-per-level: 0.004
  actionbar: true
  xp:
    kill-normal: 4
    kill-leveled-base: 6
    kill-per-level: 1.5
    kill-passive: 1
    ore: 6
    ore-rare: 15
    stone: 1
    log: 3
    dirt: 1
  abilities:
    lifesteal-chance: 0.15
    lifesteal-amount: 2.0
    executioner-bonus: 0.30
    cleave-chance: 0.25
    cleave-damage: 0.5
    lumberjack-chance: 0.20
    haste-seconds: 3
    doubledrop-chance: 0.20
    jackpot-chance: 0.05
    shovel-doubledrop-chance: 0.15
    treasure-chance: 0.03
  # Shovel "treasure" ability picks one of these at random (chance value is ignored here)
  treasure-items:
    - "CLAY_BALL:2:6:1.0"
    - "GOLD_NUGGET:3:8:1.0"
    - "FLINT:2:5:1.0"
    - "EMERALD:1:1:1.0"
    - "DIAMOND:1:1:1.0"

# ---------------- ANTI-LAG ----------------
anti-lag:
  enabled: true
  disabled-worlds: []
  # Removes the oldest excess mobs per chunk (never tamed, leashed, name-tagged or ridden mobs)
  entity-limits:
    enabled: true
    check-interval-seconds: 30
    max-monsters-per-chunk: 16
    max-animals-per-chunk: 20
    max-other-per-chunk: 10
  # Stops natural spawns in chunks that are already crowded
  spawn-limiter:
    enabled: true
    chunk-entity-hard-cap: 70
  # Clears dropped items on the ground on a timer
  item-clear:
    enabled: true
    interval-minutes: 5
    warn-seconds: [30, 10, 5, 3, 2, 1]
    min-item-age-seconds: 20
    keep-materials:
      - ELYTRA
      - TOTEM_OF_UNDYING
      - NETHERITE_INGOT
      - SHULKER_BOX
  # Estimates TPS. When it drops below lag-tps the plugin enters "lag mode":
  # natural spawns are paused and an emergency cleanup runs.
  tps-watch:
    lag-tps: 16.0
    recover-tps: 18.5
  memory-watch:
    enabled: true
    # 0.92 = 92% of max heap
    threshold: 0.92
